<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Received | Sujan S</title>
    <meta name="theme-color" content="#e6dfcc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color: #1a1a1a;
        background: #e6dfcc;
        font-family: "Special Elite", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        overflow-x: hidden;
        padding: clamp(1rem, 4vw, 3rem);
        place-items: center;
        background:
          radial-gradient(circle at center, rgba(230, 223, 204, 0.94), rgba(89, 58, 26, 0.36) 120%),
          #9b865f;
      }

      body::before,
      body::after {
        content: "";
        inset: 0;
        pointer-events: none;
        position: fixed;
      }

      body::before {
        background-image: url("https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=1600&q=80");
        background-repeat: repeat;
        background-size: 860px 860px;
        mix-blend-mode: multiply;
        opacity: 0.25;
      }

      body::after {
        background: radial-gradient(circle at center, transparent 28%, rgba(70, 35, 10, 0.18) 70%, rgba(26, 26, 26, 0.36) 125%);
        mix-blend-mode: multiply;
      }

      main {
        position: relative;
        width: min(70vw, 760px);
        border: 4px double #1a1a1a;
        background:
          radial-gradient(circle at 18% 12%, rgba(100, 54, 16, 0.18), transparent 18%),
          radial-gradient(circle at 82% 28%, rgba(165, 42, 42, 0.1), transparent 15%),
          radial-gradient(circle at 35% 82%, rgba(72, 38, 9, 0.16), transparent 19%),
          linear-gradient(rgba(26, 26, 26, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(26, 26, 26, 0.035) 1px, transparent 1px),
          #e6dfcc;
        background-size: auto, auto, auto, 18px 18px, 18px 18px, auto;
        padding: clamp(1.5rem, 5vw, 4.5rem);
        text-align: center;
        box-shadow: 0 4px 0 #1a1a1a;
        z-index: 1;
      }

      main::before {
        border: 3px double #1a1a1a;
        content: "";
        inset: clamp(0.45rem, 1.7vw, 1rem);
        pointer-events: none;
        position: absolute;
      }

      h1 {
        margin: 0;
        font-family: "Rye", serif;
        font-size: clamp(2rem, 8vw, 6rem);
        line-height: 0.88;
        text-transform: uppercase;
      }

      @media (min-width: 768px) {
        main {
          border-width: 12px;
          box-shadow: 14px 14px 0 #1a1a1a;
        }
      }

      p {
        margin: clamp(1.25rem, 4vw, 2rem) auto 0;
        max-width: 30rem;
        font-size: clamp(0.95rem, 2.5vw, 1.35rem);
        line-height: 1.8;
        text-transform: uppercase;
      }

      a {
        display: inline-block;
        margin-top: clamp(1.5rem, 4vw, 2.25rem);
        border-bottom: 4px dotted #a52a2a;
        color: #a52a2a;
        font-family: "Courier Prime", monospace;
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
      }

      @media (max-width: 420px) {
        main {
          width: 68vw;
          padding-inline: 1rem;
        }

        h1 {
          font-size: clamp(1.65rem, 8vw, 2.55rem);
        }

        p {
          font-size: 0.82rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Telegram Received</h1>
      <p>Your dispatch has been entered into the bureau ledger. A return telegraph shall be issued after inspection.</p>
      <a href="/">Return To Poster</a>
    </main>
  </body>
</html>
